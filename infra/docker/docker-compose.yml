# Local development + preview stack
version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: alaya
      POSTGRES_PASSWORD: alaya_dev
      POSTGRES_DB: alaya_insider
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  typesense:
    image: typesense/typesense:26.0
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_API_KEY=dev-key
    volumes:
      - typesense_data:/data

  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://alaya:alaya_dev@postgres:5432/alaya_insider
      REDIS_URL: redis://redis:6379
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: dev-key
    depends_on:
      - postgres
      - redis
      - typesense

volumes:
  postgres_data:
  typesense_data:
