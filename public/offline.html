<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — Alaya Insider</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F0EA;
      color: #2C2522;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 420px; }
    .icon { width: 64px; height: 64px; background: #EFE7DE; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
    .icon svg { width: 28px; height: 28px; color: #C5AA8A; }
    h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 0.75rem; }
    p { color: #6D655F; line-height: 1.6; margin-bottom: 2rem; font-size: 0.95rem; }
    .btn {
      display: inline-block; padding: 0.75rem 2rem; background: #C5AA8A; color: #fff;
      border: none; border-radius: 999px; font-size: 0.875rem; cursor: pointer;
      text-decoration: none; transition: background 0.2s;
    }
    .btn:hover { background: #B89A7A; }
    .note { margin-top: 2rem; font-size: 0.75rem; color: #8A8178; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M8.464 15.536a5 5 0 010-7.072m7.072 0a5 5 0 010 7.072M12 12h.01" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your connection. Don't worry — you can still browse your cached favorites and articles.</p>
    <a href="/" class="btn">Try again</a>
    <p class="note">Alaya Insider works offline. Your saved content is available anytime.</p>
  </div>
</body>
</html>
