# ALAYA INSIDER — Production Nginx Configuration
# For Hostinger VPS reverse proxy
# Place in /etc/nginx/sites-available/alayainsider.com

upstream alaya_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name alayainsider.com www.alayainsider.com;

    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name alayainsider.com www.alayainsider.com;

    # SSL (use Certbot / Hostinger SSL)
    ssl_certificate /etc/letsencrypt/live/alayainsider.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alayainsider.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://alaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts for long AI jobs
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Static assets caching
    location /_next/static {
        proxy_pass http://alaya_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check bypass (no rate limit)
    location /api/ops/health {
        proxy_pass http://alaya_backend;
        access_log off;
    }

    # Rate limiting (basic)
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    location /api {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://alaya_backend;
    }
}
