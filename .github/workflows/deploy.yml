name: Deploy & Release

on:
  workflow_run:
    workflows: ["CI/CD - ALAYA INSIDER"]
    types: [completed]
    branches: [main, develop]

jobs:
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to Staging
        uses: vercel/action@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --target=staging'

  deploy-production-canary:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy Canary (10%)
        uses: vercel/action@v1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --target=production-canary'

      - name: Smoke Tests + Health Checks
        run: |
          sleep 30
          curl -f https://canary.alayainsider.com/api/ops/health || exit 1
          # Additional checks for search, AI, queues

      - name: Promote to 100% Production
        if: success()
        run: |
          echo "Promoting canary to full production"
          # Vercel promote via API or manual in dashboard for safety

      - name: Automatic Rollback
        if: failure()
        run: |
          echo "Rolling back production canary"
          # Trigger Vercel rollback
