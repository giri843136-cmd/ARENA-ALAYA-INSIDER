# =============================================
# ALAYA INSIDER — HARDENED Nginx Configuration
# TLS 1.3 only, strong ciphers, WAF-level rate limiting
# For Hostinger VPS reverse proxy behind Cloudflare
# =============================================

upstream alaya_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# === RATE LIMITING ZONES ===
# General API: 30 req/s per IP with burst
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Auth endpoints: 5 req/s per IP
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
# Search: 10 req/s per IP
limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
# Affiliate clicks: 20 req/s per IP
limit_req_zone $binary_remote_addr zone=affiliate:10m rate=20r/s;
# Admin: 50 req/s per IP (higher for dashboard operations)
limit_req_zone $binary_remote_addr zone=admin:10m rate=50r/s;

# === HTTP → HTTPS REDIRECT ===
server {
    listen 80;
    server_name alayainsider.com www.alayainsider.com;
    return 301 https://$server_name$request_uri;
}

# === HTTPS SERVER ===
server {
    listen 443 ssl http2;
    server_name alayainsider.com www.alayainsider.com;

    # ========== TLS 1.3 ONLY ==========
    ssl_protocols TLSv1.3;
    ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Let's Encrypt / Cloudflare Origin Cert
    ssl_certificate /etc/letsencrypt/live/alayainsider.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alayainsider.com/privkey.pem;

    # Cloudflare Authenticated Origin Pulls (verify incoming TLS from CF)
    ssl_client_certificate /etc/ssl/certs/cloudflare-origin-ca.pem;
    ssl_verify_client on;

    # ========== SECURITY HEADERS ==========
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # CSP — strict, with nonce support (Next.js generates nonces)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cdn.vercel-insights.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        img-src 'self' data: blob: https:;
        font-src 'self' https://fonts.gstatic.com data:;
        connect-src 'self' https://api.resend.com https://o*.ingest.sentry.io https://www.google-analytics.com https://vitals.vercel-insights.com https://redis.upstash.io;
        frame-src https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
        report-uri /api/csp-violation;
    " always;

    # ========== GZIP ==========
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_vary on;

    # ========== REQUEST SIZE LIMITS ==========
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ========== MAIN PROXY ==========
    location / {
        proxy_pass http://alaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;

        # Rate limiting — general browsing
        limit_req zone=api burst=50 nodelay;
    }

    # ========== RATE-LIMITED: AUTH ENDPOINTS ==========
    location /api/auth/ {
        proxy_pass http://alaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=auth burst=10 nodelay;
    }

    # ========== RATE-LIMITED: SEARCH ==========
    location /api/search {
        proxy_pass http://alaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=search burst=20 nodelay;
    }

    # ========== RATE-LIMITED: AFFILIATE CLICKS ==========
    location /go/ {
        proxy_pass http://alaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=affiliate burst=30 nodelay;

        # Don't cache affiliate redirects
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # ========== RATE-LIMITED: ADMIN ==========
    location /admin {
        proxy_pass http://alaya_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        limit_req zone=admin burst=100 nodelay;

        # Admin proxy timeouts (AI tools need longer)
        proxy_read_timeout 300s;
    }

    # ========== STATIC ASSETS (long cache) ==========
    location /_next/static {
        proxy_pass http://alaya_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static {
        proxy_pass http://alaya_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /icons {
        proxy_pass http://alaya_backend;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ========== HEALTH CHECK (no rate limit, no logs) ==========
    location /api/ops/health {
        proxy_pass http://alaya_backend;
        access_log off;
        limit_req off;
    }

    # ========== CSP VIOLATION REPORT ==========
    location /api/csp-violation {
        proxy_pass http://alaya_backend;
        limit_req zone=api burst=10 nodelay;
    }

    # ========== DENY ACCESS TO SENSITIVE PATHS ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /node_modules {
        deny all;
        access_log off;
    }

    location ~ /\.env {
        deny all;
        access_log off;
    }
}
